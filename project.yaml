project:
  name: cic-kubernetes
  description: CIC Kubernetes domain — cluster infrastructure management as ManagedEntity
    specializations derived from cic-primitives, anchored on Talos machine config
  license: CC-BY-NC-SA-4.0
  main_branch: kubernetes/main
  owner: Gabor Zoltan Sinko
  maintenance:
    status: active
    supported_until: '2027-12-31'
  contacts:
    - type: email
      value: sinkog@centralinfracore.hu
  links:
    - name: repository
      url: https://github.com/CentralInfraCore/cic-kubernetes.git
compiler_settings:
  meta_schemas_dir: ./
  source_dir: schemas
  meta_schema_file: md.meta.schema.yaml
  primitive_schema_file: schemas/index.yaml
  vault_key_name: cic-my-sign-key
x-cic:
  repo_type: domain
  base_primitive: cic-primitives@v0.1.3
  stability: experimental
  primary_backend: talos
  known_limitations:
    - pool_to_node_materialization_not_formalized
    - operation_contracts_are_partial
    - non_talos_adapters_are_partial
    - dependency_manifest_pending
release:
  version: 0.0.dev
