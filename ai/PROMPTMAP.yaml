version: 1
context: cic-kubernetes

# Státuszok: pending | in_progress | done | blocked

entries:

  # ── Phase 1: Bootstrap ──────────────────────────────────────────────────────

  - task: "repo-bootstrap"
    status: done
    priority: 1
    milestone: bootstrap
    prompt: |
      Bootstrap cic-kubernetes repót cic-primitives@v0.1.3-ból.
      project.yaml, dependency.yaml, CLAUDE.md, ai/ testreszabása.
      Scope: Kubernetes cluster infrastruktúra — nem workload management.
    accept: make validate
    produces:
      - project.yaml
      - dependency.yaml
      - CLAUDE.md
      - ai/

  # ── Phase 2: Domain sémák ───────────────────────────────────────────────────

  - task: "kubernetes-cluster-schema"
    status: done
    priority: 2
    milestone: domain
    blocked_by: "repo-bootstrap"
    prompt: |
      Hozd létre a KubernetesCluster DomainComposition-t:
      schemas/domain/kubernetes-cluster.yaml

      Anchor: Talos ClusterConfig (dependency.yaml-ban dokumentálva)

      config_surface:
        kubernetes_version: string, mandatory (pl. v1.32.0)
        control_plane_endpoint: string (API server endpoint)
        cluster_network:
          pod_cidr: string (pl. 10.244.0.0/16)
          service_cidr: string (pl. 10.96.0.0/12)
          dns_domain: string (default: cluster.local)
        control_plane_count: integer (1 vagy 3, HA esetén)
        etcd: object (external/embedded, backup config)
        api_server: object (extra args, certSANs, audit config)
        controller_manager: object (extra args)
        scheduler: object (extra args)
        cert_sans: list of string (extra TLS SANs)

      state_surface:
        health: enum [healthy, degraded, unavailable, unknown]
        api_server_status: enum [up, down, unknown]
        etcd_status: enum [healthy, degraded, unavailable, unknown]
        kubernetes_version_actual: string
        node_count: integer
        control_plane_node_count: integer

      operations:
        upgrade: capability: upgrade — input: target_version
        rotate_certs: capability: cert_management
        get_kubeconfig: output: kubeconfig (base64)

      notifications:
        cluster-health-changed, node-count-changed, cert-expiry-warning
    accept: make validate
    produces:
      - schemas/domain/kubernetes-cluster.yaml

  - task: "kubernetes-node-schema"
    status: done
    priority: 3
    milestone: domain
    blocked_by: "kubernetes-cluster-schema"
    prompt: |
      Hozd létre a KubernetesNode DomainComposition-t:
      schemas/domain/kubernetes-node.yaml

      Anchor: Talos MachineConfig (dependency.yaml-ban dokumentálva)

      config_surface:
        machine_type: enum [controlplane, worker] — mandatory
        cluster_ref: string — CIC address a KubernetesCluster-re
        compute_ref: string — CIC address a ComputeResource-ra (D-004)
        network_ref: string — CIC address a NetworkInterface-re (D-004)
        install_disk: string — CIC address a StorageResource-ra (D-004)
        hostname: string
        kubelet: object (extra args, node labels, taints)
        sysctls: map (kernel parameters)
        ntp_servers: list of string

      state_surface:
        node_status: enum [Ready, NotReady, SchedulingDisabled, Unknown]
        kubelet_version: string
        os_version: string
        allocatable_cpu: string
        allocatable_memory: string
        allocated_pods: integer

      operations:
        cordon: idempotent — megakadályozza új Pod schedulingot
        drain: input: grace_period — kiüríti a node-ot
        reboot: capability: node_reboot
        reset: capability: node_reset — node visszaállítása gyári állapotba

      notifications:
        node-status-changed, node-pressure-warning
    accept: make validate
    produces:
      - schemas/domain/kubernetes-node.yaml

  # ── Phase 3: Adapter contractok ─────────────────────────────────────────────

  - task: "talos-adapter"
    status: done
    priority: 4
    milestone: adapters
    blocked_by: "kubernetes-node-schema"
    prompt: |
      Hozd létre a talos-adapter contract-ját:
      schemas/adapters/talos-adapter.yaml
      Talos Linux alapú cluster — gRPC API (talosctl).
      Teljes implementáció — az anchor schema alapján.
    accept: make validate
    produces:
      - schemas/adapters/talos-adapter.yaml

  - task: "k3s-adapter"
    status: done
    priority: 5
    milestone: adapters
    blocked_by: "kubernetes-node-schema"
    prompt: |
      Hozd létre a k3s-adapter contract-ját:
      schemas/adapters/k3s-adapter.yaml
      k3s lightweight Kubernetes — részleges implementáció.
      Hiányzó funkciók: conformance by deletion + D-012.
    accept: make validate
    produces:
      - schemas/adapters/k3s-adapter.yaml

  # ── Phase 4: Contract hardening ──────────────────────────────────────────────

  - task: "talos-machineconfig-mapping"
    status: done
    priority: 6
    milestone: contract-hardening
    blocked_by: "talos-adapter"
    prompt: |
      Hozd létre a Talos MachineConfig → CIC mező mapping fájlt:
      schemas/mappings/talos-machineconfig-mapping.yaml
      Minden KubernetesCluster és KubernetesNode config mező mellé a Talos config path.
    accept: make validate
    produces:
      - schemas/mappings/talos-machineconfig-mapping.yaml

  - task: "adapter-conformance-matrix"
    status: done
    priority: 7
    milestone: contract-hardening
    blocked_by: "talos-machineconfig-mapping"
    prompt: |
      Alakítsd át az adapter not_implemented_fields listákat gépileg ellenőrizhető
      conformance_matrix struktúrára minden adapter fájlban.
      Formátum: target (CIC path), type (operation/config_field/capability), support, reason.
    accept: make validate
    produces:
      - schemas/adapters/*.yaml (frissítve)
