schema_version: "1"
dependencies:
  - name: base-repo
    source: github.com/CentralInfraCore/base-repo
    tag: base@0.5.0
    mode: remote-merge
    purpose: repository-contract
    imported_paths:
      - .github/
      - Makefile
      - mk/
      - tools/
      - docker-compose.yml
      - Dockerfile
      - docs/
      - features/
      - tests/
      - project.yaml
      - project.schema.yaml
      - md.meta.schema.yaml
      - requirements.in
      - requirements.txt
      - renovate.json
      - LICENSE.md
      - LICENSE.yaml
      - LICENSE.meta.yaml
      - README.md
      - feature-list.md

  - name: cic-primitives
    source: github.com/CentralInfraCore/cic-primitives
    tag: primitives/@v0.1.3
    mode: remote-merge
    purpose: primitive-schema-base
    imported_paths:
      - schemas/atomic/
      - schemas/aggregate/
      - schemas/index.yaml
      - dependencies/

  - name: cic-compute
    source: github.com/CentralInfraCore/cic-compute
    tag: compute/@v0.2.1
    mode: reference
    purpose: cross-domain-ref
    referenced_fields:
      - KubernetesNode.state_surface.compute_ref
      - KubernetesCluster.config_surface.node_pools[].compute_requirements

  - name: cic-network
    source: github.com/CentralInfraCore/cic-network
    tag: network/@v0.2.0
    mode: reference
    purpose: cross-domain-ref
    referenced_fields:
      - KubernetesNode.state_surface.network_ref

  - name: talos-machineconfig
    source: https://www.talos.dev/latest/reference/configuration/
    tag: v1alpha1
    mode: reference
    purpose: config-anchor
    note: >
      A Talos MachineConfig/ClusterConfig schema a CIC Kubernetes domain sémájának
      anchora. Nem git merge — fogalmi referencia, manuálisan kuráljuk.
      A Talos csapat validálja a sémát.
